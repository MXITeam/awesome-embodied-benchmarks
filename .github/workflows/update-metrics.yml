name: Update citations & stars

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/benchmarks.yaml"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/update-metrics.yml"

permissions:
  contents: write

concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch citations and stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}   # optional; raises Semantic Scholar rate limits
        run: python scripts/update_metrics.py

      - name: Render README and section pages
        run: python scripts/render_readme.py

      - name: Commit changes
        run: |
          git add README.md benchmarks data/metrics.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update citations & stars ($(date -u +%Y-%m-%d))"
          # another run or a human push may have landed meanwhile:
          # rebase keeping this run's fresh metrics (-X theirs = the commit being replayed), re-render, retry
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
            python scripts/render_readme.py
            git add README.md benchmarks data/metrics.json
            git diff --cached --quiet || git commit -m "chore: re-render README after rebase"
          done
          exit 1
