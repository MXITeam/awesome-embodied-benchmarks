name: Update citations & stars

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/benchmarks.yaml"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/update-metrics.yml"

permissions:
  contents: write

concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch citations and stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}   # optional; raises Semantic Scholar rate limits
        run: python scripts/update_metrics.py

      - name: Render README
        run: python scripts/render_readme.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md data/metrics.json; then
            echo "No changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/metrics.json
          git commit -m "chore: update citations & stars ($(date -u +%Y-%m-%d))"
          git push
